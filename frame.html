<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora – ramka demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
  aurora-pulse-card, aurora-kid-card { display: block; position: fixed; inset: 0; overflow: auto; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #8fa3c8; font: 14px system-ui; }
  :root { --primary-text-color: #e8eefc; --secondary-text-color: #9fb0d0; --card-background-color: #141b30; --primary-color: #7aa2ff; --divider-color: rgba(255,255,255,.12); --secondary-background-color: #1a2340; --primary-background-color: #0b1020; --text-primary-color: #fff; }
</style></head>
<body><div id="boot">Ładowanie…</div>
<script>window.addEventListener("error", function (e) { var b = document.getElementById("boot"); if (b) b.textContent = "Błąd: " + e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")"; });</script>
<script>
(function () { var mem = {}; var q = new URLSearchParams(location.search); if (q.get('theme')) mem.pulse_theme = q.get('theme');
  var ls = {getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; }, setItem: function (k, v) { mem[k] = String(v); }, removeItem: function (k) { delete mem[k]; }, clear: function () { mem = {}; }, key: function (i) { return Object.keys(mem)[i] || null; }, get length() { return Object.keys(mem).length; }};
  try { Object.defineProperty(window, 'localStorage', {value: ls, configurable: true}); } catch (e) { /* ignore */ } })();
</script>
<script src="js/mdi-bundle.js"></script>
<script src="js/demo-hass.js"></script>
<script src="js/demo-config.js"></script>
<script type="module" src="assets/aurora-pulse-card.js"></script>
<script type="module" src="assets/aurora-kid-card.js"></script>
<script type="module">
(function () {
  const q = new URLSearchParams(location.search), v = q.get('v') || 'pulse';
  if (q.get('user')) AuroraDemo.setUser({name: q.get('user'), is_admin: false});
  const isPulse = v === 'pulse' || v === 'modules', tag = isPulse ? 'aurora-pulse-card' : 'aurora-kid-card';
  const B = document.getElementById('boot'), P = (t) => { if (B) B.textContent = t; };
  P('1 tworze ' + tag + ' zdefiniowany=' + !!customElements.get(tag) + ' AuroraDemo=' + !!window.AuroraDemo + ' CFG=' + !!window.DEMO_CFG);
  /* Manager: dashboard podstawowy + moduly opcjonalne (tryb v=modules) */
  const MODV = {zadania: ['zadania'], f1: ['f1'], radio: ['radio'], tv: ['tv']};
  const baseNav = () => ({dock: ['lights', 'events'], tdock: ['rooms', 'klimat', 'multimedia', 'events', 'pogoda', 'powietrze'], menu: ['kalendarz', 'pogoda', 'klimat', 'powietrze', 'baterie', 'multimedia', 'szkola']});
  const buildCfg = (mods) => {
    const c = JSON.parse(JSON.stringify(DEMO_CFG)), nav = baseNav();
    c.f1 = {on: mods.indexOf('f1') >= 0}; if (mods.indexOf('guard') < 0) c.guard = [];
    mods.forEach((m) => (MODV[m] || []).forEach((x) => nav.menu.push(x)));
    return {type: 'custom:aurora-pulse-card', empty: true, cfg: c, nav: nav};
  };
  let mods = (q.get('modules') || '').split(',').filter(Boolean), el = null;
  const make = () => {
    if (el) el.remove();
    el = document.createElement(tag);
    const cfg = v === 'modules' ? buildCfg(mods) : v === 'pulse' ? {type: 'custom:aurora-pulse-card', empty: true, cfg: DEMO_CFG} : DEMO_KIDS[v];
    P('2 setConfig'); el.setConfig(cfg); P('3 po setConfig');
    const b = document.getElementById('boot'); if (b) b.remove(); document.body.appendChild(el);
    P('4 hass'); el.hass = AuroraDemo.hass(); P('5 po hass'); window.card = el;
  };
  make();
  AuroraDemo.onHass((h) => { if (el) el.hass = h; });
  if (isPulse && q.get('open')) setTimeout(() => { try { el._pOpen(q.get('open')); } catch (e) { /* ignore */ } }, 900);
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.modules && v === 'modules') { mods = d.modules; make(); return; }
    if (d.theme !== undefined && el && el._pRender) { try { if (d.theme) localStorage.setItem('pulse_theme', d.theme); else localStorage.removeItem('pulse_theme'); el._fxK = ''; el._pRender(); el._pVRender(true); } catch (x) { /* ignore */ } }
    if (d.open && el && el._pOpen) { try { el._pOpen(d.open); } catch (x) { /* ignore */ } }
  });
})();
</script></body></html>
